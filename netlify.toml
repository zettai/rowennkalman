# Next.js on Netlify. This site was created in 2019 as a static site, so nothing is saved in its
# build settings: the build command, the publish folder and the Next.js runtime are declared here.
# The runtime needs publish = ".next"; without it Netlify publishes the repo root and the plugin
# stops with "publish directory cannot be the same as the base directory".
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The site was created in 2019 and Netlify defaulted it to Node 10. Next.js 16 needs 20+.
[build.environment]
  NODE_VERSION = "22"

# Legacy thesis subdomain (decided 2026-10-15, option B in LLNZ docs/domains-cloudflare-migration.md):
# every path on tesis.rowennkalman.com lands on /research, where the thesis PDFs are linked.
# Takes effect once `tesis` is a domain alias of this Netlify site (or DNS points it here).
[[redirects]]
  from = "https://tesis.rowennkalman.com/*"
  to = "https://rowennkalman.com/research"
  status = 301
  force = true

# Old thesis landing page: one permanent hop to /research. The PDFs under /tesis/*.pdf are
# real files and are not matched (no splat). Netlify treats /tesis and /tesis/ the same.
[[redirects]]
  from = "/tesis"
  to = "/research"
  status = 301
  force = true

[[redirects]]
  from = "/tesis/index.html"
  to = "/research"
  status = 301
  force = true
